<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SynaptaLab | Painel do Professor</title><style>
:root{font-family:Inter,system-ui,Arial,sans-serif;color:#15332c;background:#f3f6f4}*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{cursor:pointer}header{background:#10372e;color:#fff;padding:20px max(22px,calc((100vw - 1320px)/2));display:flex;align-items:center;justify-content:space-between;gap:20px}header strong{font-size:24px}header small{display:block;color:#d8b46d;letter-spacing:1.2px;margin-bottom:5px}.shell{max-width:1320px;margin:28px auto;padding:0 22px}.login{max-width:550px;margin:55px auto;background:#fff;padding:34px;border:1px solid #d9e6de;border-radius:16px}.login input{display:block;width:100%;padding:13px;margin:8px 0 18px;border:1px solid #aec6bb;border-radius:8px}.btn{border:0;border-radius:9px;padding:11px 17px;background:#206c54;color:white;font-weight:650}.btn.secondary{background:#e9f1ec;color:#20503d}.btn:disabled{opacity:.5}.error{color:#b42318}.ok{color:#176449}.hidden{display:none!important}.layout{display:grid;grid-template-columns:235px minmax(0,1fr);gap:22px}.sidebar{background:#fff;border:1px solid #e0e8e3;border-radius:14px;padding:14px;align-self:start}.sidebar button{display:block;width:100%;text-align:left;background:transparent;color:#294b40;border:0;padding:13px 12px;border-radius:9px;margin-bottom:4px}.sidebar button.active{background:#dcefe5;font-weight:750;color:#10583d}.main h1{font-size:27px;margin:0 0 7px}.muted{color:#60786e}.notice{border:1px solid #e7d6aa;background:#fff9ea;color:#73531a;border-radius:10px;padding:12px 15px;margin:18px 0}.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px;margin:20px 0}.metric,.panel,.case{background:#fff;border:1px solid #dfe9e3;border-radius:13px;padding:19px}.metric b{font-size:29px;display:block;color:#185e45}.metric span{color:#63766d;font-size:13px}.panel{margin-top:16px}.panel h2{font-size:19px;margin:0 0 14px}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}.case h3{margin:6px 0}.case p{font-size:14px;line-height:1.5;color:#4f695f}.tag{display:inline-block;background:#e8f3ec;color:#1e6449;font-size:12px;padding:5px 9px;border-radius:99px}.line{display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid #e6ece8;padding:12px 0}.line:last-child{border:0}.progress{height:9px;border-radius:20px;background:#e6eee8;overflow:hidden}.progress>div{height:100%;background:#2b8662}.tools{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}.tools input{padding:11px;border:1px solid #c5d7cd;border-radius:8px;min-width:220px}.tablewrap{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:650px}th,td{text-align:left;border-bottom:1px solid #e6eee8;padding:12px;font-size:14px}th{background:#f3f7f4}footer{text-align:center;padding:35px;color:#73877e;font-size:12px}@media(max-width:950px){.metrics{grid-template-columns:repeat(2,1fr)}.cards{grid-template-columns:repeat(2,1fr)}}@media(max-width:650px){.layout{display:block}.sidebar{display:flex;overflow:auto;margin-bottom:20px}.sidebar button{white-space:nowrap}.cards,.metrics{grid-template-columns:1fr}header strong{font-size:18px}.shell{padding:0 13px}}
</style></head><body><header><div><small>LAB · SEMINÁRIOS CLÍNICOS</small><strong>SynaptaLab</strong></div><div id="who" style="font-size:13px"></div></header><div class="shell"><section id="login" class="login"><h1>Acesso do professor</h1><p class="muted">Entre com sua conta administrativa do Firebase.</p><form id="loginForm"><label>E-mail<input id="email" type="email" autocomplete="username" required></label><label>Senha<input id="password" type="password" autocomplete="current-password" required></label><button id="enter" class="btn" type="submit">Entrar</button></form><p id="status" role="status"></p></section><div id="workspace" class="layout hidden"><nav class="sidebar" aria-label="Seções do painel"><button data-view="overview" class="active">▦ Visão geral</button><button data-view="cases">▤ Casos clínicos</button><button data-view="groups">♧ Grupos</button><button data-view="students">♙ Estudantes</button><button data-view="tasks">☑ Tarefas em duplas</button><button data-view="reports">▥ Avaliação e relatórios</button><button id="exit">↪ Sair</button></nav><main class="main"><div id="content"></div></main></div></div><footer>SynaptaLab · Ambiente acadêmico de simulação · Versão de avaliação do painel</footer><script type="module" src="./app.js"></script></body></html>
