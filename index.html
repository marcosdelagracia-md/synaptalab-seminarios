<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SynaptaLab · Seminários Clínicos</title><style>
:root{font:16px system-ui,Arial;color:#153a30;background:#f2f6f3}*{box-sizing:border-box}body{margin:0}header{background:#10372e;color:white;padding:22px 5vw}header small{color:#dfc17c;display:block}main{max-width:1150px;margin:25px auto;padding:0 18px}.card{background:white;border:1px solid #d5e3d9;border-radius:14px;padding:22px;margin:14px 0}input,textarea,select{font:inherit;padding:11px;border:1px solid #adc4b8;border-radius:8px;width:100%;margin:7px 0 14px}textarea{min-height:180px}button{font:inherit;background:#206d52;color:white;border:0;border-radius:8px;padding:10px 15px;cursor:pointer;margin:4px}button:disabled{opacity:.5;cursor:not-allowed}.secondary{background:#e2efe7;color:#174b39}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}.muted{color:#5e756a}.error{color:#a22119}.ok{color:#146a42}.hidden{display:none}.bar{height:9px;background:#dce9e1;border-radius:9px}.bar span{display:block;background:#2b8564;height:100%;border-radius:9px}nav{display:flex;flex-wrap:wrap;gap:5px}pre{white-space:pre-wrap;overflow-wrap:anywhere}label{display:block}h1,h2{margin-top:0}table{border-collapse:collapse;width:100%}td,th{padding:9px;text-align:left;border-bottom:1px solid #ddd}
</style></head><body><header><small>LAB · SEMINÁRIOS CLÍNICOS</small><h1>SynaptaLab</h1><span id="identity"></span></header><main><div id="message" role="status"></div><section id="login" class="card"><h2>Acesso ao laboratório</h2><form id="loginForm"><label>E-mail<input id="email" type="email" autocomplete="username" required></label><label>Senha<input id="password" type="password" autocomplete="current-password" required></label><button type="submit" id="enter">Entrar</button></form><p class="muted">As contas devem ser previamente criadas pelo administrador no Firebase Authentication.</p></section><section id="app" class="hidden"><nav><button class="secondary" id="refresh">Atualizar</button><button class="secondary" id="logout">Sair</button></nav><div id="workspace"></div></section></main><script type="module" src="./app.js"></script></body></html>
