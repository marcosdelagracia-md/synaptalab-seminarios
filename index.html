<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SynaptaLab · Teste do Professor</title><style>:root{font-family:system-ui,Arial;background:#f3f7f4;color:#19352f}body{margin:0}header{background:#12352e;color:white;padding:32px max(20px,calc((100% - 850px)/2))}main{max-width:850px;margin:28px auto;padding:0 18px}.panel{background:white;padding:24px;border-radius:16px;border:1px solid #d7e6df;box-shadow:0 4px 16px #12352e0a}label{display:block;margin:14px 0 5px}input{box-sizing:border-box;width:100%;padding:12px;border:1px solid #afc6bc;border-radius:8px;font:inherit}button{padding:12px 18px;border:0;border-radius:9px;background:#216a57;color:white;cursor:pointer;margin-top:16px}button:disabled{opacity:.5}.hidden{display:none}.ok{color:#146a47}.error{color:#a32b25}#status{white-space:pre-wrap}small{color:#d9c68c}code{overflow-wrap:anywhere}</style></head><body><header><small>LAB · SEMINÁRIOS CLÍNICOS</small><h1>SynaptaLab</h1><div>Validação de acesso do professor</div></header><main><section class="panel"><div id="login"><h2>Entrar com a conta do professor</h2><label for="email">E-mail</label><input id="email" type="email" autocomplete="username"><label for="password">Senha</label><input id="password" type="password" autocomplete="current-password"><button id="enter">Entrar</button></div><div id="teacher" class="hidden"><h2 class="ok">Acesso administrativo reconhecido</h2><p>Autenticação concluída e documento administrativo ativo confirmado no Firestore.</p><p>UID: <code id="uid"></code></p><p>Este é um teste de acesso, não o painel completo do professor.</p><button id="exit">Sair</button></div><p id="status" role="status"></p></section></main><script type="module" src="./app.js"></script></body></html>
