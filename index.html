<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SynaptaLab | Seminários Clínicos</title><style>
:root{font-family:Inter,system-ui,Arial,sans-serif;color:#123c30;background:#f1f6f3}*{box-sizing:border-box}body{margin:0}header{background:#10372e;color:#fff;padding:22px max(20px,calc((100vw - 1160px)/2));display:flex;justify-content:space-between;gap:20px;align-items:center}header small{display:block;color:#dbba78;letter-spacing:1px}header strong{font-size:24px}main{max-width:1160px;margin:26px auto;padding:0 18px}.card{background:#fff;border:1px solid #d4e5dc;border-radius:14px;padding:22px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}.grid .card{margin:0}button{background:#1b6a4e;color:#fff;border:0;border-radius:8px;padding:11px 16px;cursor:pointer;font:inherit}button:disabled{opacity:.45;cursor:not-allowed}.secondary{background:#e5efe9;color:#164b37}.danger{background:#a12d25}input,textarea,select{display:block;width:100%;padding:12px;border:1px solid #b5ccc0;border-radius:8px;font:inherit;margin:7px 0 15px}textarea{min-height:150px}label{display:block;font-weight:600}.hidden{display:none!important}.muted{color:#647a70}.error{color:#b42318}.ok{color:#146744}.bar{background:#e6efe9;height:10px;border-radius:20px;overflow:hidden}.bar span{display:block;height:100%;background:#278762}.actions{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}.auth{max-width:550px;margin:40px auto}.status{padding:10px 0;min-height:25px}table{border-collapse:collapse;width:100%}th,td{text-align:left;padding:10px;border-bottom:1px solid #e3ece6;vertical-align:top}th{background:#f4f8f5}.notice{padding:13px;background:#fff8e7;border:1px solid #e6d8ad;border-radius:8px}.stage{white-space:pre-wrap;line-height:1.6;overflow-wrap:anywhere}.pill{display:inline-block;background:#e4f2e9;color:#17583d;border-radius:30px;padding:5px 10px;font-size:12px;margin:3px}.report-section{border-left:4px solid #278762;padding:10px 16px;margin:16px 0;background:#f7faf8}.report-section h3{margin:5px 0}.report-section p{white-space:pre-wrap}.rich-editor{border:1px solid #b5ccc0;border-radius:8px;min-height:220px;padding:16px;line-height:1.6;overflow:auto;overflow-wrap:anywhere;background:#fff}.rich-editor:focus{outline:2px solid #278762}.rich-content{line-height:1.6;overflow-wrap:anywhere;overflow-x:auto}.rich-content img,.rich-editor img{max-width:100%;height:auto}.rich-content table,.rich-editor table{width:100%;border-collapse:collapse;margin:12px 0}.rich-content th,.rich-content td,.rich-editor th,.rich-editor td{border:1px solid #b5ccc0;padding:8px}.rich-toolbar{display:flex;gap:5px;flex-wrap:wrap;padding:8px;background:#f4f8f5;border:1px solid #d4e5dc;border-radius:8px}.rich-toolbar button{padding:7px 10px}.rich-editor p{margin:8px 0}.rich-preview{border:1px dashed #b5ccc0;padding:14px;border-radius:8px;min-height:60px}.editor-hint{font-size:13px;color:#647a70}footer{text-align:center;color:#75897f;padding:30px}@media(max-width:600px){header{display:block}header strong{font-size:20px}.card{padding:16px}}
</style></head><body><header><div><small>LAB · SEMINÁRIOS CLÍNICOS</small><strong>SynaptaLab</strong></div><span id="identity"></span></header><main><section id="login" class="auth"><div class="card"><h1>Entrar</h1><form id="loginForm"><label>E-mail<input id="email" type="email" required autocomplete="username"></label><label>Senha<input id="password" type="password" required autocomplete="current-password"></label><button id="enter" type="submit">Entrar</button></form><p class="muted">Primeiro acesso? Crie sua conta de estudante abaixo.</p></div><div class="card"><h2>Cadastro de estudante</h2><form id="signupForm"><label>Nome completo<input id="signupName" required minlength="5" maxlength="120"></label><label>E-mail<input id="signupEmail" type="email" required></label><label>Senha (mínimo de 8 caracteres)<input id="signupPassword" type="password" required minlength="8" autocomplete="new-password"></label><button id="signupButton" type="submit">Criar minha conta</button></form><p class="muted">O código PSI será reservado automaticamente. Não compartilhe sua senha.</p></div></section><section id="app" class="hidden"><div class="actions"><button class="secondary" id="refresh">Atualizar</button><button class="secondary" id="logout">Sair</button></div><div id="workspace"></div></section><p id="message" class="status" role="status" aria-live="polite"></p></main><footer>SynaptaLab · Simulação acadêmica · Dados fictícios</footer><script type="module" src="./app.js"></script></body></html>
